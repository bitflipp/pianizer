<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pianizer</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #ccc;
      font: 12px monospace;
      overflow: hidden;
    }

    ph-toolbar {
      flex: 0 0 auto;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #main {
      display: flex;
      flex: 1 1 0;
      min-height: 0;
    }

    #roll-column {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-width: 0;
    }

    #roll-container {
      flex: 1 1 0;
      min-height: 0;
    }

    #roll-column canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #roll-column #minimap { cursor: grab; }

    #tempo-container {
      flex: 0 0 150px;
      min-height: 0;
      border-top: 1px solid #444;
    }

    #pedal-container {
      flex: 0 0 75px;
      min-height: 0;
      border-top: 1px solid #444;
    }

    #minimap-container {
      flex: 0 0 75px;
      min-height: 0;
      border-top: 1px solid #444;
    }

    #status {
      flex: 0 0 20px;
      background: #111;
      border-top: 1px solid #444;
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      padding: 0 5px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Tool windows */
    .tool-window {
      position: fixed;
      z-index: 200;
      background: #111;
      border: 1px solid #444;
      font: 12px monospace;
      color: #fff;
    }
    .tool-window-title {
      background: #222;
      padding: 4px 8px;
      font-size: 11px;
      color: #888;
      border-bottom: 1px solid #333;
      user-select: none;
    }
    .tool-window-body {
      padding: 5px;
    }
    .velocity-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
    }
    .velocity-grid button {
      border: 1px solid;
      /* text color is set inline per-button (luminance-adaptive); see styleVelocityBtn */
      font: 12px monospace;
      padding: 4px 4px 4px 0;
      cursor: pointer;
      text-align: right;
      min-width: 34px;
    }
    .delta-grid {
      display: flex;
      gap: 2px;
    }
    .delta-btn {
      background: #222;
      border: 1px solid #666;
      color: #fff;
      font: 12px monospace;
      padding: 4px 8px;
      cursor: pointer;
      min-width: 34px;
      text-align: center;
    }
    .delta-btn:hover { background: #333; border-color: #bbb; }
    .shape-row { display: flex; gap: 2px; margin-bottom: 5px; }
    .shape-row .delta-btn.sel { background: #333; border-color: #fff; color: #fff; }
    /* Curve-shape buttons: easing glyph stacked above the label. */
    .shape-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 6px; }
    .shape-glyph { width: 30px; height: 18px; display: block; }
    .shape-glyph-axes  { fill: none; stroke: #555; stroke-width: 1; }
    /* currentColor tracks the button's text color, so glyph and label stay matched. */
    .shape-glyph-curve { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Help overlay */
    .help-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 300;
      background: #111;
      border: 1px solid #444;
      font: 12px monospace;
      color: #fff;
      max-height: 90vh;
      overflow-y: auto;
    }
    .help-overlay-title {
      background: #222;
      padding: 4px 8px;
      font-size: 11px;
      color: #888;
      border-bottom: 1px solid #333;
      user-select: none;
    }
    .help-overlay-body { padding: 5px; }
    .help-section { margin: 0 0 10px; }
    .help-section:last-child { margin-bottom: 0; }
    .help-section h4 {
      margin: 0 0 4px;
      font: 11px monospace;
      color: #5a9fd4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .help-rows { display: grid; grid-template-columns: max-content 1fr; column-gap: 14px; row-gap: 2px; }
    .help-key { color: #fff; white-space: nowrap; }
    .help-desc { color: #aaa; }

  </style>
</head>
<body>

<div id="app">
  <ph-toolbar></ph-toolbar>
  <div id="main">
    <div id="roll-column">
      <div id="roll-container">
        <canvas id="roll"></canvas>
      </div>
      <div id="tempo-container">
        <canvas id="tempo"></canvas>
      </div>
      <div id="pedal-container">
        <canvas id="pedal"></canvas>
      </div>
      <div id="minimap-container">
        <canvas id="minimap"></canvas>
      </div>
    </div>
  </div>
  <div id="status">Load MusicXML or a project file to begin · Press [?] for help</div>
</div>

<script type="module">
  import { state, SNAP_GRIDS, SCALE_EASINGS, snapGridTicks } from './engine/state.js';
  import { loadMusicXmlBuffer }      from './engine/musicxml.js';
  import { midiOut }                 from './engine/midi-out.js';
  import { PianoRoll, noteHSL, labelColorFor } from './ui/roll.js';
  import { PedalLane }               from './ui/pedal-lane.js';
  import { TempoLane }               from './ui/tempo-lane.js';
  import { Minimap }                 from './ui/minimap.js';
  import { canvasPos, isFormFocused, PITCH_MAX } from './ui/dom-utils.js';
  import './ui/toolbar.js';

  // Best-effort localStorage write — swallows quota / private-mode errors.
  const safeSet = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  };

  // localStorage keys, named once so save and load can't drift apart silently.
  const AUTOSAVE_KEY     = 'pianizer-autosave';
  const VEL_CURVE_KEY    = 'pianizer-vel-curve';
  const RESTRIKE_GAP_KEY = 'pianizer-restrike-gap';
  const viewKey = () => `pianizer-view-${state.pieceId}`;

  // ── Canvas setup ───────────────────────────────────────────────────
  const canvas             = document.getElementById('roll');
  const rollContainer      = document.getElementById('roll-container');
  const tempoCanvas        = document.getElementById('tempo');
  const tempoContainer     = document.getElementById('tempo-container');
  const pedalCanvas        = document.getElementById('pedal');
  const pedalContainer     = document.getElementById('pedal-container');
  const minimapCanvas      = document.getElementById('minimap');
  const minimapContainer   = document.getElementById('minimap-container');

  const roll      = new PianoRoll(canvas);
  const tempoLane = new TempoLane(tempoCanvas, roll);
  const pedalLane = new PedalLane(pedalCanvas, roll);
  const minimap   = new Minimap(minimapCanvas, roll);

  // The lanes and minimap mirror the roll's horizontal view (scroll/zoom/width) plus a
  // few pieces of shared state. They stay in sync two ways: (a) by subscribing directly
  // to the state events they each render (below), and (b) via this post-render hook for
  // the roll's *view transform* — pan/zoom/resize are roll-internal and fire no state
  // event. The hook is gated on a view signature, so the many hover-only roll repaints
  // (note/edge/pitch/bookmark highlight, lane reticle tracking) don't cascade into
  // re-rendering all three downstream canvases.
  let _lastViewSig = null;
  roll.onPostRender = () => {
    const sig = `${roll.scrollX}|${roll.scrollY}|${roll.pixelsPerTick}|${roll.rollWidth}`;
    if (sig === _lastViewSig) return;
    _lastViewSig = sig;
    tempoLane.render();
    pedalLane.render();
    minimap.render();
    scheduleViewSave();
  };
  roll.pedalLane = pedalLane;
  roll.tempoLane = tempoLane;

  // Non-view state each downstream canvas renders, subscribed directly so a change
  // updates only the canvases that show it — not all three via a roll repaint. The
  // minimap draws notes/used-range/bookmarks/playhead (so it tracks selectionchanged,
  // which every note edit dispatches, plus bookmarks and the playhead); the lanes draw
  // their curve, the snap grid and the playhead (curve data via their own
  // pedalchanged/tempochanged subscription). Neither shows roll hover or per-note
  // selection detail, so selectionchanged touches only the minimap and snapchanged only
  // the lanes.
  for (const ev of ['loaded', 'selectionchanged', 'playheadmoved', 'bookmarkschanged']) {
    state.addEventListener(ev, () => minimap.render());
  }
  for (const ev of ['loaded', 'playheadmoved', 'snapchanged']) {
    state.addEventListener(ev, () => { tempoLane.render(); pedalLane.render(); });
  }

  function observeResize(cv, container, render) {
    new ResizeObserver(() => {
      cv.width  = container.clientWidth;
      cv.height = container.clientHeight;
      render();
    }).observe(container);
  }
  observeResize(canvas,        rollContainer,    () => roll.render());
  observeResize(tempoCanvas,   tempoContainer,   () => tempoLane.render());
  observeResize(pedalCanvas,   pedalContainer,   () => pedalLane.render());
  observeResize(minimapCanvas, minimapContainer, () => minimap.render());

  // ── Status bar ────────────────────────────────────────────────────
  const statusEl = document.getElementById('status');
  const HELP_HINT = ' · Press [?] for help';

  function updateStatus() {
    if (!state.loaded) {
      statusEl.textContent = 'Load MusicXML or a project file to begin' + HELP_HINT;
      return;
    }
    const sel = state.selectedNoteIndices.size;
    const tail = sel > 0 ? ` · ${sel} selected` : '';
    statusEl.textContent = `${state.notes.length} notes${tail}${HELP_HINT}`;
  }

  state.addEventListener('loaded',           updateStatus);
  state.addEventListener('selectionchanged', updateStatus);
  updateStatus();

  // Transient status message (e.g. a blocked edit on locked notes), reverts after a beat.
  let _flashTimer = null;
  function flashStatus(message) {
    statusEl.textContent = message;
    clearTimeout(_flashTimer);
    _flashTimer = setTimeout(updateStatus, 2000);
  }
  document.addEventListener('roll-flash', e => flashStatus(e.detail.message));

  // Guard shared by the curve / velocity / delta tools: they need a
  // non-empty selection. Returns false (and the tool aborts) when nothing is selected.
  function requireSelection() {
    return state.selectedNoteIndices.size > 0;
  }

  // ── Tool window system ────────────────────────────────────────────
  let _currentTool = null;
  let _velocityCurveWindow = null;
  let _mouseX = 0, _mouseY = 0;

  window.addEventListener('mousemove', e => { _mouseX = e.clientX; _mouseY = e.clientY; });

  function closeVelocityCurveWindow() {
    if (!_velocityCurveWindow) return;
    _velocityCurveWindow.remove();
    _velocityCurveWindow = null;
  }

  function positionWindow(win) {
    const PAD = 15;
    win.style.visibility = 'hidden';
    document.body.appendChild(win);
    const rect = win.getBoundingClientRect();
    const left = _mouseX - rect.width  / 2;
    const top  = _mouseY - rect.height / 2;
    win.style.left = Math.min(Math.max(PAD, left), window.innerWidth  - rect.width  - PAD) + 'px';
    win.style.top  = Math.min(Math.max(PAD, top),  window.innerHeight - rect.height - PAD) + 'px';
    win.style.visibility = 'visible';
  }

  // Floating window scaffold shared by the tool windows and the velocity curve
  // editor: outer frame, title bar, content body.
  function buildWindowShell(title) {
    const win = document.createElement('div');
    win.className = 'tool-window';

    const titleEl = document.createElement('div');
    titleEl.className = 'tool-window-title';
    titleEl.textContent = title;
    win.appendChild(titleEl);

    const body = document.createElement('div');
    body.className = 'tool-window-body';
    win.appendChild(body);

    return { win, titleEl, body };
  }

  // Opens a tool window. buildContent receives (body, close) — call close() to
  // dismiss the window from inside button handlers. Returns nothing useful.
  function openToolWindow(title, buildContent) {
    closeTool();
    const { win, body } = buildWindowShell(title);
    buildContent(body, closeTool);
    positionWindow(win);
    _currentTool = win;
  }

  function closeTool() {
    if (!_currentTool) return;
    _currentTool.remove();
    _currentTool = null;
  }

  // Close on click outside the tool window
  document.addEventListener('mousedown', e => {
    if (_currentTool && !_currentTool.contains(e.target)) closeTool();
    if (_velocityCurveWindow  && !_velocityCurveWindow.contains(e.target))  closeVelocityCurveWindow();
  }, true);

  // ── Help overlay ──────────────────────────────────────────────────
  const HELP_SECTIONS = [
    ['Selection', [
      ['Click note',           'Select just that note'],
      ['Shift+click note',     'Toggle note in the selection (add, or remove if already selected)'],
      ['Drag empty',           'Rectangle select (replaces selection)'],
      ['Shift+drag empty',     'Rectangle select (extends selection)'],
      ['Click empty',          'Clear selection'],
      ['Ctrl+Z',               'Undo (removes the last selection change)'],
      ['Escape',               'Clear selection'],
    ]],
    ['Editing', [
      ['1',                       'Velocity tool'],
      ['2',                       'Curve tool (bake an eased velocity ramp over the selection)'],
      ['3',                       'Velocity delta tool'],
      ['Alt+click',               'Insert note at cursor (one snap-step long)'],
      ['Alt+drag',                'Insert note, dragging sets its duration'],
      ['Drag note body',          'Move selection (axis-locked: timing or pitch)'],
      ['Drag left / right edge',  'Resize note start / end (handles show on hover)'],
      ['Delete / Backspace',      'Delete selected notes'],
      ['M',                       'Mute / unmute selected notes'],
      ['Ctrl+Z / Ctrl+Y',         'Undo / redo'],
    ]],
    ['View', [
      ['Scroll',               'Pan horizontal'],
      ['Ctrl+scroll',          'Zoom horizontal'],
      ['Right-drag',           'Pan (horizontal + vertical)'],
      ['Home / End',           'Scroll to start / end'],
    ]],
    ['Playback', [
      ['Space',                       'Play / pause'],
      ['Click empty roll / ruler',    'Seek playhead'],
      ['Drag ruler',                  'Scrub playhead'],
      ['Ctrl+click ruler',            'Add bookmark'],
      ['Ctrl+right-click bookmark',   'Remove bookmark'],
      ['← / →',                       'Seek to prev / next bookmark'],
    ]],
    ['Curve lanes (pedal / tempo)', [
      ['Click empty',          'Add control point (snaps to grid and Y to neighbours / baseline)'],
      ['Ctrl+click',           'Add without snapping'],
      ['Drag point',           'Move control point (snaps to grid and Y; hold Ctrl to disable)'],
      ['Right-click',          'Remove nearest control point'],
    ]],
  ];

  let _helpOverlay = null;

  function openHelpOverlay() {
    closeTool();
    const overlay = document.createElement('div');
    overlay.className = 'help-overlay';

    const titleEl = document.createElement('div');
    titleEl.className = 'help-overlay-title';
    titleEl.textContent = 'Keyboard & mouse shortcuts — press [?] or [Esc] to close';
    overlay.appendChild(titleEl);

    const body = document.createElement('div');
    body.className = 'help-overlay-body';
    for (const [section, rows] of HELP_SECTIONS) {
      const sec = document.createElement('div');
      sec.className = 'help-section';
      const h = document.createElement('h4');
      h.textContent = section;
      sec.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'help-rows';
      for (const [key, desc] of rows) {
        const k = document.createElement('span'); k.className = 'help-key';  k.textContent = key;
        const d = document.createElement('span'); d.className = 'help-desc'; d.textContent = desc;
        grid.appendChild(k); grid.appendChild(d);
      }
      sec.appendChild(grid);
      body.appendChild(sec);
    }
    overlay.appendChild(body);
    document.body.appendChild(overlay);
    _helpOverlay = overlay;
  }

  function closeHelpOverlay() {
    if (!_helpOverlay) return;
    _helpOverlay.remove();
    _helpOverlay = null;
  }

  document.addEventListener('mousedown', e => {
    if (_helpOverlay && !_helpOverlay.contains(e.target)) closeHelpOverlay();
  }, true);

  // ── Velocity curve window ─────────────────────────────────────────
  const VC_MARGIN = 24;   // left margin width for delta labels
  const VC_CW     = 7;    // cell width  (88 cols → 616 px)
  const VC_CH     = 6;    // cell height (45 rows → 270 px)
  const VC_ROWS     = 45;
  const VC_COLS     = 88;
  const VC_ZERO_ROW = 22;
  const VC_W      = VC_MARGIN + VC_COLS * VC_CW;  // 640
  const VC_H      = VC_ROWS * VC_CH;               // 270

  function saveVelocityCurve() { safeSet(VEL_CURVE_KEY, state.velocityCurve); }

  function renderVelocityCurve(canvas) {
    const ctx   = canvas.getContext('2d');
    const curve = state.velocityCurve;

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, VC_W, VC_H);

    ctx.strokeStyle = '#252525';
    ctx.lineWidth = 1;
    for (let r = 0; r <= VC_ROWS; r += 5) {
      const y = r * VC_CH + 0.5;
      ctx.beginPath();
      ctx.moveTo(VC_MARGIN, y);
      ctx.lineTo(VC_W, y);
      ctx.stroke();
    }

    ctx.fillStyle = '#2e2e2e';
    ctx.fillRect(VC_MARGIN, VC_ZERO_ROW * VC_CH, VC_COLS * VC_CW, VC_CH);

    ctx.fillStyle = '#555';
    ctx.font = '9px monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let d = -20; d <= 20; d += 5) {
      const row = VC_ZERO_ROW - d;
      if (row < 0 || row > VC_ROWS) continue;
      ctx.fillText(d === 0 ? '0' : d > 0 ? `+${d}` : String(d),
                   VC_MARGIN - 2, row * VC_CH + VC_CH / 2);
    }

    ctx.fillStyle = '#d4a840';
    for (let c = 0; c < VC_COLS; c++) {
      const row = VC_ZERO_ROW - (curve[c] ?? 0);
      ctx.fillRect(VC_MARGIN + c * VC_CW + 1, row * VC_CH + 1, VC_CW - 1, VC_CH - 1);
    }

    ctx.strokeStyle = 'rgba(212,168,64,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c < VC_COLS; c++) {
      const row = VC_ZERO_ROW - (curve[c] ?? 0);
      const x = VC_MARGIN + c * VC_CW + VC_CW / 2;
      const y = row * VC_CH + VC_CH / 2;
      if (c === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function velocityCurveCell(canvas, e) {
    const { x, y } = canvasPos(canvas, e);
    return {
      col: Math.floor((x - VC_MARGIN) / VC_CW),
      row: Math.floor(y / VC_CH),
    };
  }

  function velocityCurvePaint(canvas, fromCol, fromRow, toCol, toRow) {
    if (fromCol < 0) { fromCol = toCol; fromRow = toRow; }
    const newCurve = state.velocityCurve.slice();
    const c0 = Math.max(0, Math.min(VC_COLS - 1, Math.min(fromCol, toCol)));
    const c1 = Math.max(0, Math.min(VC_COLS - 1, Math.max(fromCol, toCol)));
    for (let c = c0; c <= c1; c++) {
      const t   = fromCol === toCol ? 0 : (c - fromCol) / (toCol - fromCol);
      const row = Math.max(0, Math.min(VC_ROWS - 1,
                    Math.round(fromRow + (toRow - fromRow) * t)));
      newCurve[c] = VC_ZERO_ROW - row;
    }
    state.setVelocityCurve(newCurve);
    renderVelocityCurve(canvas);
    saveVelocityCurve();
  }

  function openVelocityCurveWindow() {
    if (_velocityCurveWindow) { closeVelocityCurveWindow(); return; }

    const { win, titleEl, body } = buildWindowShell('Velocity curve');
    titleEl.style.cssText = 'display:flex;justify-content:space-between;align-items:center';
    const closeX = document.createElement('span');
    closeX.textContent = '✕';
    closeX.style.cssText = 'cursor:pointer;color:#888;padding:0 2px;user-select:none';
    closeX.addEventListener('mousedown', e => { e.stopPropagation(); closeVelocityCurveWindow(); });
    titleEl.appendChild(closeX);

    const velocityCurveCanvas = document.createElement('canvas');
    velocityCurveCanvas.width  = VC_W;
    velocityCurveCanvas.height = VC_H;
    velocityCurveCanvas.style.cssText = `display:block;cursor:crosshair;width:${VC_W}px;height:${VC_H}px;border:1px solid #444`;
    body.appendChild(velocityCurveCanvas);

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;justify-content:flex-end;margin-top:5px';
    const resetBtn = document.createElement('button');
    resetBtn.className = 'delta-btn';
    resetBtn.textContent = 'Reset all';
    resetBtn.addEventListener('click', ev => {
      ev.stopPropagation();
      state.setVelocityCurve(new Array(VC_COLS).fill(0));
      renderVelocityCurve(velocityCurveCanvas);
      saveVelocityCurve();
    });
    btnRow.appendChild(resetBtn);
    body.appendChild(btnRow);

    renderVelocityCurve(velocityCurveCanvas);

    positionWindow(win);
    _velocityCurveWindow = win;

    velocityCurveCanvas.addEventListener('mousedown', e => {
      if (e.button === 2) {
        const { col } = velocityCurveCell(velocityCurveCanvas, e);
        if (col >= 0 && col < VC_COLS) velocityCurvePaint(velocityCurveCanvas, col, VC_ZERO_ROW, col, VC_ZERO_ROW);
        return;
      }
      if (e.button !== 0) return;
      _velocityCurvePainting = true;
      _velocityCurveLastCol  = -1;
      const { col, row } = velocityCurveCell(velocityCurveCanvas, e);
      velocityCurvePaint(velocityCurveCanvas, -1, -1, col, row);
      _velocityCurveLastCol = col; _velocityCurveLastRow = row;
    });

    velocityCurveCanvas.addEventListener('mousemove', e => {
      if (!_velocityCurvePainting) return;
      const { col, row } = velocityCurveCell(velocityCurveCanvas, e);
      velocityCurvePaint(velocityCurveCanvas, _velocityCurveLastCol, _velocityCurveLastRow, col, row);
      _velocityCurveLastCol = col; _velocityCurveLastRow = row;
    });
  }

  // Paint-drag state for the velocity curve editor. Module-scoped (with one
  // window-level mouseup) rather than per-window: a listener added inside
  // openVelocityCurveWindow would accumulate on every open, since the window
  // teardown removes only the DOM subtree, not window listeners.
  let _velocityCurvePainting = false;
  let _velocityCurveLastCol  = -1;
  let _velocityCurveLastRow  = -1;
  window.addEventListener('mouseup', () => { _velocityCurvePainting = false; });

  document.addEventListener('vel-curve', openVelocityCurveWindow);

  // ── Tool keyboard shortcuts (capture phase — runs before roll.js) ──
  window.addEventListener('keydown', e => {
    // Escape closes velocity curve window
    if (e.key === 'Escape' && _velocityCurveWindow) {
      e.preventDefault();
      e.stopImmediatePropagation();
      closeVelocityCurveWindow();
      return;
    }

    // Escape closes active tool without clearing selection
    if (e.key === 'Escape' && _currentTool) {
      e.preventDefault();
      e.stopImmediatePropagation();
      closeTool();
      return;
    }

    // '?' toggles the help overlay; Escape also closes it
    if (e.key === '?' && !_currentTool && !isFormFocused(e)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      if (_helpOverlay) closeHelpOverlay(); else openHelpOverlay();
      return;
    }
    if (e.key === 'Escape' && _helpOverlay) {
      e.preventDefault();
      e.stopImmediatePropagation();
      closeHelpOverlay();
      return;
    }

    // Undo / redo
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey && state.loaded) {
      e.preventDefault();
      state.undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey)) && state.loaded) {
      e.preventDefault();
      state.redo();
      return;
    }

    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (isFormFocused(e)) return;

    if (e.key === '1' && state.loaded) { e.preventDefault(); openVelocityTool(); }
    if (e.key === '2' && state.loaded) { e.preventDefault(); openCurveTool(); }
    if (e.key === '3' && state.loaded) { e.preventDefault(); openDeltaTool(); }
  }, true);

  // Applies velocity-based background/border to a velocity grid button.
  // `mode`: 'normal' | 'hover' | 'selected'
  function styleVelocityBtn(btn, v, mode) {
    const fill = noteHSL(v, mode === 'normal' ? 'normal' : 'hovered');
    btn.style.background  = fill;
    // Label color tracks the fill's luminance (same rule as the roll's per-note
    // numbers) so bright high-velocity buttons stay legible — white on yellow doesn't.
    btn.style.color       = labelColorFor(fill);
    btn.style.borderColor = mode === 'selected' ? '#fff' : mode === 'hover' ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.5)';
    // Draw the selected emphasis with an inset shadow rather than a thicker
    // border so the button's box size stays fixed and the grid never reflows.
    btn.style.boxShadow  = mode === 'selected' ? 'inset 0 0 0 1px #fff' : 'none';
  }

  // Velocity preset palette shared by the [2] velocity tool and the [1] ramp picker.
  const VEL_PRESET_MIN  = 5;
  const VEL_PRESET_MAX  = 120;
  const VEL_PRESET_STEP = 5;

  function makeVelocityBtn(v) {
    const btn = document.createElement('button');
    btn.textContent = String(v);
    styleVelocityBtn(btn, v, 'normal');
    btn.addEventListener('mouseenter', () => { if (btn.dataset.sel !== '1') styleVelocityBtn(btn, v, 'hover'); });
    btn.addEventListener('mouseleave', () => { if (btn.dataset.sel !== '1') styleVelocityBtn(btn, v, 'normal'); });
    return btn;
  }

  // Builds the velocity-preset grid; onPick(v, btn) fires on each button click.
  function buildVelocityGrid(onPick) {
    const grid = document.createElement('div');
    grid.className = 'velocity-grid';
    for (let v = VEL_PRESET_MIN; v <= VEL_PRESET_MAX; v += VEL_PRESET_STEP) {
      const btn = makeVelocityBtn(v);
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        onPick(v, btn);
      });
      grid.appendChild(btn);
    }
    return grid;
  }

  // ── Tool: Note velocity [1] ───────────────────────────────────────
  function openVelocityTool() {
    if (!requireSelection()) return;
    openToolWindow('Note velocity', (body, close) => {
      body.appendChild(buildVelocityGrid(v => {
        state.setNoteVelocities([...state.selectedNoteIndices], v);
        close();
      }));
    });
  }

  // ── Tool: Curve [2] ──────────────────────────────────────────────
  // One-shot velocity shaper (state.applyVelocityCurve): bakes an eased start→end
  // ramp across the selection by onset time and stops there — a one-shot edit,
  // nothing persisted. Ramp shapes (SCALE_EASINGS, in engine/state.js) map a normalized
  // onset position t∈[0,1] → eased fraction of the start→end velocity span, so the
  // musician picks a crescendo/decrescendo contour deliberately.

  // Builds a small SVG glyph that plots an easing curve (onset t∈[0,1] → eased
  // value∈[0,1], origin bottom-left) by sampling the easing function itself, so the
  // icon is always an exact preview of the ramp shape it triggers — no hand-drawn
  // path to keep in sync if SCALE_EASINGS changes.
  const GLYPH_W = 30, GLYPH_H = 18, GLYPH_PAD = 2, GLYPH_SAMPLES = 24;
  function buildEasingGlyph(fn) {
    const SVG = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('class', 'shape-glyph');
    svg.setAttribute('viewBox', `0 0 ${GLYPH_W} ${GLYPH_H}`);
    svg.setAttribute('aria-hidden', 'true');           // label carries the accessible name
    const xL = GLYPH_PAD, xR = GLYPH_W - GLYPH_PAD;
    const yB = GLYPH_H - GLYPH_PAD, yT = GLYPH_PAD;     // y grows downward, so bottom = max y
    // Faint L-shaped axes (left + bottom) anchor the curve's reading direction.
    const axes = document.createElementNS(SVG, 'path');
    axes.setAttribute('class', 'shape-glyph-axes');
    axes.setAttribute('d', `M${xL} ${yT} L${xL} ${yB} L${xR} ${yB}`);
    svg.appendChild(axes);
    let d = '';
    for (let i = 0; i <= GLYPH_SAMPLES; i++) {
      const t = i / GLYPH_SAMPLES;
      const x = xL + t * (xR - xL);
      const y = yB - fn(t) * (yB - yT);
      d += `${i === 0 ? 'M' : 'L'}${x.toFixed(2)} ${y.toFixed(2)} `;
    }
    const curve = document.createElementNS(SVG, 'path');
    curve.setAttribute('class', 'shape-glyph-curve');
    curve.setAttribute('d', d.trim());
    svg.appendChild(curve);
    return svg;
  }

  // Builds the Linear / Ease in / Ease out / S-curve selector row, calling
  // onPick(name) when a button is chosen. `selected` highlights the current shape.
  // Each button pairs an easing-curve glyph with its text label.
  function buildShapeRow(selected, onPick) {
    const row = document.createElement('div');
    row.className = 'shape-row';
    for (const name of Object.keys(SCALE_EASINGS)) {
      const btn = document.createElement('button');
      btn.className = 'delta-btn shape-btn';
      btn.title = name;
      btn.appendChild(buildEasingGlyph(SCALE_EASINGS[name]));
      const label = document.createElement('span');
      label.textContent = name;
      btn.appendChild(label);
      if (name === selected) btn.classList.add('sel');
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        row.querySelectorAll('.delta-btn').forEach(b => b.classList.toggle('sel', b === btn));
        onPick(name);
      });
      row.appendChild(btn);
    }
    return row;
  }

  // Builds the two-click velocity-ramp picker: the shape selector row and the
  // 5–120 velocity grid. The first click sets the start velocity, the second the
  // end; then onPick(from, to, shape) fires.
  function buildRampPicker(body, initialShape, onPick) {
    let firstValue = null;
    let shape      = initialShape;

    body.appendChild(buildShapeRow(shape, name => { shape = name; }));
    body.appendChild(buildVelocityGrid((v, btn) => {
      if (firstValue === null) {
        firstValue = v;
        btn.dataset.sel = '1';
        styleVelocityBtn(btn, v, 'selected');
      } else if (v !== firstValue) {
        onPick(firstValue, v, shape);
      }
    }));
  }

  function openCurveTool() {
    if (!requireSelection()) return;

    const indices = [...state.selectedNoteIndices];

    openToolWindow('Curve', (body, close) => {
      buildRampPicker(body, 'S-curve', (from, to, shape) => {
        state.applyVelocityCurve(indices, from, to, shape);
        close();
      });
    });
  }

  // ── Tool: Velocity delta [3] ─────────────────────────────────────
  function openDeltaTool() {
    if (!requireSelection()) return;
    openToolWindow('Velocity delta', (body, close) => {
      const grid = document.createElement('div');
      grid.className = 'delta-grid';
      for (const delta of [-10, -5, -1, +1, +5, +10]) {
        const btn = document.createElement('button');
        btn.className = 'delta-btn';
        btn.textContent = delta > 0 ? `+${delta}` : String(delta);
        btn.addEventListener('click', ev => {
          ev.stopPropagation();
          const pairs = [...state.selectedNoteIndices].map(i => [i, state.notes[i].velocity + delta]);
          state.setNoteVelocitiesMap(pairs);
          close();
        });
        grid.appendChild(btn);
      }
      body.appendChild(grid);
    });
  }

  // ── Toolbar events ─────────────────────────────────────────────────
  document.addEventListener('load-file', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xml,.musicxml';
    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      try {
        await loadMusicXmlBuffer(buf);
        fitView();
        restoreView();
      } catch (err) {
        alert('Could not parse MusicXML file: ' + err.message);
        console.error(err);
      }
    };
    input.click();
  });

  // Project files are written gzip-compressed (.json.gz) — a >1 MB score
  // shrinks to ~80 KB. Reads accept either gzip or plain JSON, detected by
  // the gzip magic bytes (0x1f 0x8b), so older uncompressed files still load.
  async function gzip(str) {
    const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Blob([await new Response(stream).arrayBuffer()], { type: 'application/gzip' });
  }
  async function readProjectText(file) {
    const buf   = new Uint8Array(await file.arrayBuffer());
    const gzipped = buf[0] === 0x1f && buf[1] === 0x8b;
    if (!gzipped) return new TextDecoder().decode(buf);
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  function projectFilename(d = new Date()) {
    const p = (n, w = 2) => String(n).padStart(w, '0');
    return `${p(d.getFullYear(), 4)}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json.gz`;
  }

  document.addEventListener('save-project', async () => {
    if (!state.loaded) return;
    const json = JSON.stringify(state.saveProject(), null, 2);
    const blob = await gzip(json);
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: projectFilename() });
    a.click();
    URL.revokeObjectURL(url);
  });

  document.addEventListener('load-project', () => {
    const input = document.createElement('input');
    input.type   = 'file';
    input.accept = '.json,.gz';
    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const data = JSON.parse(await readProjectText(file));
        state.loadProject(data);
        fitView();
        restoreView();
      } catch (err) {
        alert('Could not load project file: ' + err.message);
        console.error(err);
      }
    };
    input.click();
  });

  function fitView() {
    const rollW = roll.rollWidth;
    roll.pixelsPerTick = state.totalTicks > 0
      ? Math.max(0.01, Math.min(2, rollW / state.totalTicks))
      : 0.06;
    roll.scrollX = 0;

    if (state.notes.length > 0) {
      const HEADROOM_SEMITONES = 2;   // blank space above the highest note
      const maxP = Math.max(...state.notes.map(n => n.pitch));
      roll.scrollY = Math.max(0, (PITCH_MAX - maxP - HEADROOM_SEMITONES) * roll.noteHeight);
    }
  }

  // ── Playback ───────────────────────────────────────────────────────
  let animFrame          = null;
  let playStartPerfMs    = null;
  let playStartPieceTime = null;
  // Sticky "play from here" position. Set by manual seek, cleared by Stop
  // and on load. Play snaps the playhead to this and Pause snaps it back, so
  // the same passage can be replayed without re-seeking.
  let playAnchor         = null;

  function getPieceTime() {
    if (playStartPerfMs === null) return playStartPieceTime ?? 0;
    return playStartPieceTime + (performance.now() - playStartPerfMs) / 1000 * state.playSpeed;
  }

  // (Re)starts MIDI scheduling from `fromTime` and rebases the playback clock.
  // schedulePlayback's per-note prep can take ~100ms; it invokes onReady once
  // that's done, and rebaselining the clock there keeps the playhead and the
  // first scheduled notes both starting from `fromTime`, not ~100ms in.
  function scheduleFrom(fromTime) {
    playStartPieceTime = fromTime;
    playStartPerfMs    = performance.now();
    midiOut.schedulePlayback(fromTime, getPieceTime,
      () => { playStartPerfMs = performance.now(); });
  }

  document.addEventListener('toggle-playback', () => {
    if (!state.loaded) return;
    if (state.playing) pausePlayback(); else startPlayback();
  });

  document.addEventListener('stop-playback', stopPlayback);
  document.addEventListener('midi-connect',  () => midiOut.requestAccess());

  const SPEED_VALUES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];

  document.addEventListener('play-speed', e => {
    const newSpeed = e.detail.speed;
    if (state.playing) {
      // Re-anchor with old speed before switching, so the playhead doesn't jump.
      // No explicit stopPlayback here: schedulePlayback does its own reset,
      // scoped to the channels in use — a full 16-channel reset would flood the
      // pipe right before the rescheduled notes (see midi-out.js).
      const currentTime = getPieceTime();
      state.setPlaySpeed(newSpeed);
      scheduleFrom(currentTime);
    } else {
      state.setPlaySpeed(newSpeed);
    }
    scheduleViewSave();
  });

  function startPlayback() {
    if (playAnchor === null) playAnchor = state.playheadTime;
    else                     state.setPlayheadTime(playAnchor);

    // Centre the view on the playhead if it's currently off-screen, so playback
    // always starts in view rather than scrolling silently somewhere off-frame.
    const playTick = state.timeToTick(state.playheadTime);
    const visTicks = roll.rollWidth / roll.pixelsPerTick;
    if (playTick < roll.scrollX || playTick > roll.scrollX + visTicks) {
      roll.scrollX = roll._clampScrollX(playTick - visTicks / 2);
      roll.render();
    }

    scheduleFrom(playAnchor);
    state.setPlaying(true);
    tick();
  }

  function pausePlayback() {
    state.setPlaying(false);
    cancelAnimationFrame(animFrame);
    midiOut.stopPlayback();
    // Snap the playhead back to where this playback started — that's where it
    // will resume from if left untouched, so the displayed position matches.
    if (playAnchor !== null) state.setPlayheadTime(playAnchor);
  }

  function stopPlayback() {
    pausePlayback();
    state.setPlayheadTime(0);
    playAnchor = null;
  }

  function tick() {
    if (!state.playing) return;
    const pieceTime = getPieceTime();
    if (pieceTime >= state.totalTime) { pausePlayback(); return; }
    state.setPlayheadTime(pieceTime);

    const playTick = state.timeToTick(pieceTime);
    const playX    = roll.tickToX(playTick);
    const margin   = 80;
    if (playX > canvas.width - margin) {
      roll.scrollX = roll._clampScrollX(roll.scrollX + (canvas.width - margin * 2) / roll.pixelsPerTick);
    }

    animFrame = requestAnimationFrame(tick);
  }

  // ── Seek (resets the play-from anchor) ──────────────────────────────
  canvas.addEventListener('user-seek', e => {
    playAnchor = e.detail.time;
    if (!state.playing) return;
    // schedulePlayback resets the in-use channels itself — see play-speed above.
    scheduleFrom(e.detail.time);
  });

  state.addEventListener('loaded', () => { playAnchor = null; });

  // ── Disable right mouse button everywhere ──────────────────────────
  window.addEventListener('contextmenu', e => e.preventDefault());

  // ── Prevent browser zoom on Ctrl+wheel ────────────────────────────
  window.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });

  // ── Grid rerender on snap change ────────────────────────────────────
  // The lanes redraw their grid via their own 'snapchanged' subscription; the roll
  // redraws its grid here. snapGrid isn't part of the view signature, so persist it
  // explicitly (onPostRender's scheduleViewSave only fires on a view-transform change).
  state.addEventListener('snapchanged', () => { roll.render(); scheduleViewSave(); });

  // ── Auto-save to localStorage ─────────────────────────────────────
  let _autosaveTimer = null;
  let _viewSaveTimer = null;

  function scheduleViewSave() {
    if (!state.pieceId) return;
    clearTimeout(_viewSaveTimer);
    _viewSaveTimer = setTimeout(() => safeSet(viewKey(), {
      pixelsPerTick: roll.pixelsPerTick,
      scrollX:       roll.scrollX,
      scrollY:       roll.scrollY,
      snapGrid:      state.snapGrid,
      playSpeed:     state.playSpeed,
    }), 500);
  }

  function restoreView() {
    let restoredSpeed = 1.0;
    try {
      const saved = state.pieceId && localStorage.getItem(viewKey());
      if (saved) {
        const v = JSON.parse(saved);
        if (v.pixelsPerTick != null) roll.pixelsPerTick = v.pixelsPerTick;
        if (v.scrollX       != null) roll.scrollX = roll._clampScrollX(v.scrollX);
        if (v.scrollY       != null) roll.scrollY = roll._clampScrollY(v.scrollY);
        if (v.snapGrid != null && SNAP_GRIDS.includes(v.snapGrid)) state.setSnapGrid(v.snapGrid);
        if (v.playSpeed != null && SPEED_VALUES.includes(v.playSpeed)) restoredSpeed = v.playSpeed;
      }
    } catch (_) {}
    if (state.playSpeed !== restoredSpeed) state.setPlaySpeed(restoredSpeed);
    roll.render();
  }

  function scheduleAutosave() {
    if (!state.loaded) return;
    clearTimeout(_autosaveTimer);
    _autosaveTimer = setTimeout(() => safeSet(AUTOSAVE_KEY, state.saveProject()), 1000);
  }

  state.addEventListener('loaded',           scheduleAutosave);
  state.addEventListener('selectionchanged', scheduleAutosave);
  state.addEventListener('pedalchanged',     scheduleAutosave);
  state.addEventListener('tempochanged',     scheduleAutosave);

  window.addEventListener('beforeunload', () => {
    if (_autosaveTimer !== null && state.loaded) {
      clearTimeout(_autosaveTimer);
      _autosaveTimer = null;
      safeSet(AUTOSAVE_KEY, state.saveProject());
    }
  });

  // Load per-device velocity curve (independent of score/project)
  try {
    const vc = localStorage.getItem(VEL_CURVE_KEY);
    if (vc) {
      const arr = JSON.parse(vc);
      if (Array.isArray(arr) && arr.length === VC_COLS)
        state.velocityCurve = arr.map(v => Math.max(-VC_ZERO_ROW, Math.min(VC_ZERO_ROW, Math.round(v))));
    }
  } catch (_) {}

  // Per-device re-strike gap (output-instrument property, independent of score)
  state.addEventListener('restrikegapchanged', () => safeSet(RESTRIKE_GAP_KEY, state.restrikeGapMs));
  try {
    const rg = localStorage.getItem(RESTRIKE_GAP_KEY);
    if (rg !== null) state.setRestrikeGap(Number(JSON.parse(rg)));
  } catch (_) {}

  try {
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if (saved) {
      state.loadProject(JSON.parse(saved));
      fitView();
      restoreView();
      const n = state.notes.length;
      statusEl.textContent = `Restored from autosave · ${n} note${n !== 1 ? 's' : ''}${HELP_HINT}`;
      setTimeout(updateStatus, 3000);
    }
  } catch (_) {}

  // Playwright test hooks — not used in normal operation
  window._state         = state;
  window._roll          = roll;
  window._testLoad      = data => { state.loadProject(data); fitView(); roll.render(); };
  window._snapGridTicks = snapGridTicks;
</script>
</body>
</html>
